services:
  server:
#    image: ${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      - "9000:9000/tcp"
    environment:
      RUST_LOG: debug
    networks:
      - game-network

  client:
#    image: ${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "8080:80/tcp"
    depends_on:
      - server
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
